name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tap-guard:
    name: tap guard unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: python3 -m unittest test_tap_guard
        working-directory: bridge
        run: python3 -m unittest test_tap_guard
